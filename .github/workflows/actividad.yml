# Cuánto se usó el juego (totales de Cloudflare). Se corre a mano desde la pestaña Actions.
name: Actividad del juego
on:
  workflow_dispatch:
    inputs:
      modo:
        description: 'resumen o sondeo'
        default: resumen
      dias:
        description: 'cuántos días para atrás (1 a 30)'
        default: '7'
permissions:
  contents: read
  actions: read
jobs:
  actividad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Leer las estadísticas
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node server/actividad.mjs "${{ inputs.modo }}" "${{ inputs.dias }}"
