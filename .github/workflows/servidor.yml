# Prueba y publica el juego y el servidor en Cloudflare.
# - En cada cambio (cualquier rama o pull request): arma index.html desde el código (build.py), revisa que el
#   index.html del repo esté al día (GitHub Pages sirve ese), corre las pruebas (reglas, mesa, cuentas y las de
#   navegador con Playwright contra wrangler dev) y guarda la página armada.
# - En main: publica en Cloudflare exactamente esa página probada y prueba el servidor publicado.
# - En la rama "mejoras": lo mismo, pero en el entorno de pruebas (truco-uruguayo-pruebas, con sus propios datos).
# Necesita los secretos CLOUDFLARE_API_TOKEN (plantilla "Edit Cloudflare Workers") y CLOUDFLARE_ACCOUNT_ID.
# Para volver atrás una publicación: Actions → "Volver atrás una publicación" (volver-atras.yml).
name: Publicar en Cloudflare
on:
  push:
    branches: [main, mejoras]
  pull_request:
  workflow_dispatch:
concurrency: cloudflare-${{ github.ref }}
jobs:
  probar:
    # 24.04: Playwright todavía no trae navegadores para ubuntu-latest (26.04)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Herramientas
        run: npm ci
      - name: Armar el juego desde el código
        run: python3 build.py
      - name: El index.html del repo está al día
        run: git diff --quiet -- index.html || { echo "::error::index.html no coincide con lo que arma build.py. Corré python3 build.py y subilo."; git diff --stat -- index.html; exit 1; }
      - name: Tipos (TypeScript con JSDoc)
        run: npx tsc -p tsconfig.json
      - name: Pruebas del juego
        run: node test.js
      - name: Pruebas del servidor
        run: node server/prueba-mesa.mjs
      - name: Pruebas de las cuentas
        run: node server/prueba-cuentas.mjs
      - name: Pruebas de navegador
        run: |
          npx playwright install --with-deps chromium
          npm run navegador
      - name: Informe de las pruebas de navegador (si fallan)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: informe-playwright
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - name: Guardar la página probada
        uses: actions/upload-artifact@v4
        with:
          name: pagina
          path: public/
          retention-days: 30

  publicar:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: probar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: La página probada
        uses: actions/download-artifact@v4
        with:
          name: pagina
          path: public/
      - name: Dirección en workers.dev
        # La primera vez la cuenta de Cloudflare no tiene subdominio en workers.dev y wrangler no puede
        # elegirlo solo; acá se registra uno (se puede cambiar después en el panel de Cloudflare).
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          TOKEN=$(printf %s "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')
          CUENTA=$(printf %s "$ACCOUNT" | tr -d '[:space:]')
          API="https://api.cloudflare.com/client/v4/accounts/$CUENTA/workers/subdomain"
          r=$(curl -s -H "Authorization: Bearer $TOKEN" -H 'Accept: application/json' "$API")
          sub=$(echo "$r" | jq -r '.result.subdomain // empty')
          [ -n "$sub" ] || echo "Sin subdominio todavía: $(echo "$r" | jq -c '.errors')"
          if [ -z "$sub" ]; then
            for nombre in tomasaldaya truco-uruguayo truco-uy-juego; do
              jq -nc --arg s "$nombre" '{subdomain: $s}' > cuerpo.json
              r=$(curl -s -X PUT -H "Authorization: Bearer $TOKEN" -H 'Accept: application/json' -H 'Content-Type: application/json' --data-binary @cuerpo.json "$API")
              if echo "$r" | jq -e '.success' >/dev/null; then sub=$nombre; echo "Subdominio registrado: $sub"; break; fi
              echo "No se pudo con $nombre: $(echo "$r" | jq -c '.errors')"
            done
          fi
          if [ -z "$sub" ]; then echo "::error::No hay subdominio de workers.dev"; exit 1; fi
          echo "SUB=$sub" >> "$GITHUB_ENV"
      - name: Publicar
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          export CLOUDFLARE_API_TOKEN=$(printf %s "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')
          if [ -n "$ACCOUNT" ]; then export CLOUDFLARE_ACCOUNT_ID=$(printf %s "$ACCOUNT" | tr -d '[:space:]'); fi
          npx wrangler deploy 2>&1 | tee deploy.log
          url=$(grep -o 'https://[a-z0-9.-]*workers\.dev' deploy.log | head -1)
          [ -n "$url" ] || url="https://truco-uruguayo.$SUB.workers.dev"
          echo "## Dirección del servidor" >> "$GITHUB_STEP_SUMMARY"
          echo "$url" >> "$GITHUB_STEP_SUMMARY"
          echo "Servidor: $url"
          echo "URL=$url" >> "$GITHUB_ENV"
      - name: Probar el servidor publicado
        # dos jugadores de prueba arman una mesa en el servidor de verdad, juegan unas jugadas y la cierran
        run: |
          for i in $(seq 1 12); do curl -sf "$URL/api/salud" && break; echo "esperando a que el servidor conteste…"; sleep 10; done
          node server/prueba-vivo.mjs "$URL"

  publicar-pruebas:
    if: github.ref == 'refs/heads/mejoras' && github.event_name != 'pull_request'
    needs: probar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: La página probada
        uses: actions/download-artifact@v4
        with:
          name: pagina
          path: public/
      - name: Dirección en workers.dev
        # La primera vez la cuenta de Cloudflare no tiene subdominio en workers.dev y wrangler no puede
        # elegirlo solo; acá se registra uno (se puede cambiar después en el panel de Cloudflare).
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          TOKEN=$(printf %s "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')
          CUENTA=$(printf %s "$ACCOUNT" | tr -d '[:space:]')
          API="https://api.cloudflare.com/client/v4/accounts/$CUENTA/workers/subdomain"
          r=$(curl -s -H "Authorization: Bearer $TOKEN" -H 'Accept: application/json' "$API")
          sub=$(echo "$r" | jq -r '.result.subdomain // empty')
          [ -n "$sub" ] || echo "Sin subdominio todavía: $(echo "$r" | jq -c '.errors')"
          if [ -z "$sub" ]; then
            for nombre in tomasaldaya truco-uruguayo truco-uy-juego; do
              jq -nc --arg s "$nombre" '{subdomain: $s}' > cuerpo.json
              r=$(curl -s -X PUT -H "Authorization: Bearer $TOKEN" -H 'Accept: application/json' -H 'Content-Type: application/json' --data-binary @cuerpo.json "$API")
              if echo "$r" | jq -e '.success' >/dev/null; then sub=$nombre; echo "Subdominio registrado: $sub"; break; fi
              echo "No se pudo con $nombre: $(echo "$r" | jq -c '.errors')"
            done
          fi
          if [ -z "$sub" ]; then echo "::error::No hay subdominio de workers.dev"; exit 1; fi
          echo "SUB=$sub" >> "$GITHUB_ENV"
      - name: Publicar
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          export CLOUDFLARE_API_TOKEN=$(printf %s "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')
          if [ -n "$ACCOUNT" ]; then export CLOUDFLARE_ACCOUNT_ID=$(printf %s "$ACCOUNT" | tr -d '[:space:]'); fi
          npx wrangler deploy --env pruebas 2>&1 | tee deploy.log
          url=$(grep -o 'https://[a-z0-9.-]*workers\.dev' deploy.log | head -1)
          [ -n "$url" ] || url="https://truco-uruguayo-pruebas.$SUB.workers.dev"
          echo "## Dirección del entorno de pruebas" >> "$GITHUB_STEP_SUMMARY"
          echo "$url" >> "$GITHUB_STEP_SUMMARY"
          echo "Servidor: $url"
          echo "URL=$url" >> "$GITHUB_ENV"
      - name: Probar el servidor publicado
        # dos jugadores de prueba arman una mesa en el servidor de verdad, juegan unas jugadas y la cierran
        run: |
          for i in $(seq 1 12); do curl -sf "$URL/api/salud" && break; echo "esperando a que el servidor conteste…"; sleep 10; done
          node server/prueba-vivo.mjs "$URL"
