# Vuelve atrás una publicación del servidor en Cloudflare (la página y el servidor van juntos en el Worker).
# Actions → "Volver atrás una publicación" → Run workflow. Sin número de versión, vuelve a la anterior; la lista de
# las últimas versiones sale en el registro del paso "Versiones". Los datos (cuentas, mesas) no se tocan.
# GitHub Pages sirve el index.html de main: para volverlo atrás, revertir el commit en main.
name: Volver atrás una publicación
on:
  workflow_dispatch:
    inputs:
      entorno:
        description: 'produccion o pruebas'
        required: true
        default: produccion
        type: choice
        options: [produccion, pruebas]
      version:
        description: 'Versión a la que volver (vacío = la anterior)'
        required: false
      motivo:
        description: 'Por qué (queda anotado en Cloudflare)'
        required: false
        default: 'Vuelta atrás desde GitHub Actions'
concurrency: cloudflare-rollback
jobs:
  volver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Versiones
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          ENV_FLAG=""; [ "${{ inputs.entorno }}" = "pruebas" ] && ENV_FLAG="--env pruebas"
          npx wrangler versions list $ENV_FLAG
      - name: Volver atrás
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VERSION: ${{ inputs.version }}
          MOTIVO: ${{ inputs.motivo }}
        run: |
          ENV_FLAG=""; [ "${{ inputs.entorno }}" = "pruebas" ] && ENV_FLAG="--env pruebas"
          npx wrangler rollback $VERSION $ENV_FLAG --message "$MOTIVO" --yes
