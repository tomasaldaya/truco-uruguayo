<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Truco Uruguayo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya:wght@500;700;800&family=Alegreya+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --felt:#1f5a3c; --felt2:#17462f; --felt-line:rgba(255,255,255,.08);
  --wood:#5a3620; --wood2:#3d2414;
  --ink:#f6efe0; --muted:#c9d6c9; --paper:#fbf6ea; --paper-edge:#e4d9bf;
  --gold:#e8b13a; --btn:#f3ead6; --btn-ink:#2b1d10;
  --cw:84px; --ch:128px;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:'Alegreya Sans',system-ui,sans-serif;color:var(--ink);
  background:radial-gradient(1200px 700px at 50% 20%, #2a2016, #140e09 70%);min-height:100vh}
button{font-family:inherit}
.app{max-width:1280px;margin:0 auto;padding:16px;display:grid;grid-template-columns:1fr 300px;gap:16px}
header.top{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:'Alegreya',serif;font-weight:800;font-size:28px;margin:0;letter-spacing:.5px}
h1 span{color:var(--gold)}
h1 small{font-family:'Alegreya Sans',sans-serif;font-size:15px;font-weight:500;color:var(--muted);margin-left:8px}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.tool{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.15);color:var(--ink);padding:7px 12px;border-radius:999px;cursor:pointer;font-size:14px}
.tool:hover{background:rgba(255,255,255,.14)}
.tool[aria-pressed="true"]{background:var(--gold);color:#2b1d10;border-color:var(--gold)}

.table{position:relative;border-radius:28px;padding:18px;margin:13px;
  background:radial-gradient(ellipse at 50% 45%, rgba(255,255,255,.07), transparent 60%),
    repeating-linear-gradient(45deg, var(--felt-line) 0 1px, transparent 1px 6px),
    linear-gradient(var(--felt), var(--felt2));
  box-shadow:0 0 0 10px var(--wood),0 0 0 13px var(--wood2),0 18px 50px rgba(0,0,0,.6),inset 0 0 80px rgba(0,0,0,.35);
  min-height:640px;display:grid;gap:10px;
  grid-template-columns:1fr;grid-template-areas:"top" "center" "status" "bottom";grid-template-rows:auto 1fr auto auto}
.table.four{grid-template-columns:150px 1fr 150px;grid-template-areas:"top top top" "left center right" "status status status" "bottom bottom bottom"}
.table.six{grid-template-columns:150px 1fr 150px;grid-template-areas:"tl top tr" "left center right" "status status status" "bottom bottom bottom"}
.s-tl{grid-area:tl}.s-tr{grid-area:tr}
.s-tl,.s-tr{flex-direction:column;justify-content:center;gap:6px}
.table.six .s-top{flex-direction:column;justify-content:center;gap:6px}
.s-tl .bubble,.s-tr .bubble{top:-8px;left:8px}
.seat.inactive{opacity:.4}
.tag.out{background:#6b6258;color:#fff}
.duel{background:rgba(243,210,122,.16);border:1px solid rgba(243,210,122,.5);color:#f3d27a;border-radius:999px;padding:3px 12px;font-size:14px;font-weight:700}
.stats{width:100%;border-collapse:collapse;font-size:15px;margin:6px 0}
.stats td{padding:4px 6px;border-bottom:1px solid #e4d9bf}.stats td:last-child{text-align:right;font-weight:700}
.opts{display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center;font-size:15px;margin:10px 0}
.opts select{font:inherit;padding:4px 6px;border-radius:8px;border:1px solid #cdbf9f;background:#fff;max-width:260px}
.opts .h{grid-column:1/-1;font-family:'Alegreya',serif;font-weight:700;font-size:17px;margin-top:6px}
.s-top{grid-area:top}.s-left{grid-area:left}.s-right{grid-area:right}.s-bottom{grid-area:bottom}
.center{grid-area:center}.statusbox{grid-area:status}
.seat{display:flex;align-items:center;gap:14px;position:relative}
.s-top{min-height:118px}
.table.four .s-top{justify-content:center;flex-wrap:wrap;row-gap:6px}
.table.four .s-top .senas{flex-basis:100%}
.s-left,.s-right{flex-direction:column;justify-content:center;gap:8px}
.s-bottom{flex-direction:column;align-items:center}
.who{display:flex;flex-direction:column;gap:3px;min-width:110px}
.s-left .who,.s-right .who{align-items:center;min-width:0;text-align:center}
.who .name{font-family:'Alegreya',serif;font-weight:700;font-size:20px}
.who .sub{font-size:12px;color:var(--muted)}
.tags{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.tag{font-size:12px;padding:2px 8px;border-radius:999px;background:rgba(0,0,0,.3);color:var(--muted)}
.tag.mano{background:var(--gold);color:#2b1d10;font-weight:700}
.tag.flor{background:#f3d27a;color:#2b1d10}
.tag.turn{background:#fff;color:#2b1d10;font-weight:700}
.hand{display:flex;gap:10px;justify-content:center}
.hand.mini{gap:0}
.hand.mini .back{width:44px;height:66px;border-width:3px;margin-left:-18px}
.hand.mini .back:first-child{margin-left:0}
.bubble{position:absolute;background:var(--paper);color:#2b1d10;font-family:'Alegreya',serif;font-weight:800;
  font-size:21px;padding:7px 14px;border-radius:16px;box-shadow:0 6px 18px rgba(0,0,0,.35);white-space:nowrap;z-index:5;
  animation:pop .35s ease-out, fade .6s ease-in 2.8s forwards;pointer-events:none}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes fade{to{opacity:0}}
.s-top .bubble{left:58%;top:18px}
.table.four .s-top .bubble{left:auto;right:4%;top:6px}
.s-left .bubble{left:8px;top:-18px}
.s-right .bubble{right:8px;top:-18px}
.s-bottom .bubble{right:12px;top:-62px}
.senas{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;font-size:13px}
.sena{background:rgba(0,0,0,.28);border-radius:999px;padding:3px 9px;color:var(--ink)}
.sena b{font-weight:700;color:var(--gold)}
.sena.caught{background:rgba(243,210,122,.18);border:1px dashed #f3d27a}

.center{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center}
.tricks{display:flex;gap:18px;justify-content:center}
.slot{display:flex;flex-direction:column;gap:8px;align-items:center;padding:8px;border-radius:14px;border:1px dashed rgba(255,255,255,.14);min-width:104px}
.slot .lbl,.chips .lbl{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
.res{font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:rgba(0,0,0,.35)}
.res.win{background:var(--gold);color:#2b1d10}
.res.parda{background:#9aa;color:#123}
.ph{width:var(--cw);height:var(--ch);border-radius:9px;border:1px dashed rgba(255,255,255,.12)}
.muestra-box{display:flex;flex-direction:column;align-items:center;gap:6px}
.muestra-box .lbl{font-size:12px;color:var(--gold);text-transform:uppercase;letter-spacing:1.5px;font-weight:700}
.deckpile{position:relative;width:96px;height:140px}
.deckpile .back{position:absolute;left:0;top:6px;transform:rotate(-6deg)}
.deckpile .card{position:absolute;left:10px;top:0;transform:rotate(4deg)}
/* cruz de 4 */
.cross-wrap{display:flex;flex-direction:column;align-items:center;gap:10px}
.chips{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}
.cross{display:grid;grid-template-columns:repeat(3,var(--cw));grid-template-rows:repeat(3,calc(var(--ch)*.62));gap:6px 22px;align-items:center;justify-items:center}
.cross .c-top{grid-column:2;grid-row:1;align-self:start}
.cross .c-left{grid-column:1;grid-row:2}
.cross .c-tl{grid-column:1;grid-row:1;align-self:start}
.cross .c-tr{grid-column:3;grid-row:1;align-self:start}
.cross .c-right{grid-column:3;grid-row:2}
.cross .c-bottom{grid-column:2;grid-row:3;align-self:end}
.cross .faded{opacity:.55}

.status{display:flex;align-items:center;justify-content:center;gap:10px;min-height:26px;font-size:16px;color:var(--muted);text-align:center}
.status b{color:var(--ink)}
.dots::after{content:"";animation:dots 1.2s steps(4) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
.helper{font-size:14px;color:var(--muted);text-align:center;min-height:20px}
.helper b{color:var(--gold)}
.helper i{color:#f3d27a}
.actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;min-height:46px}
.act{border:0;border-radius:12px;padding:10px 16px;font-size:17px;font-weight:700;cursor:pointer;
  background:var(--btn);color:var(--btn-ink);box-shadow:0 3px 0 rgba(0,0,0,.35);transition:transform .08s}
.act:hover{transform:translateY(-1px)}
.act:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.35)}
.act.truco{background:#c7412f;color:#fff}.act.env{background:#2f62a8;color:#fff}
.act.flor{background:var(--gold);color:#2b1d10}.act.yes{background:#3c8a4a;color:#fff}
.act.no{background:#6b6258;color:#fff}
.act.mazo{background:transparent;color:var(--muted);box-shadow:none;border:1px solid rgba(255,255,255,.25)}
.sing{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}
.sing input{width:84px;font-size:20px;font-weight:700;padding:8px 10px;border-radius:12px;border:2px solid var(--gold);background:var(--paper);color:#2b1d10;text-align:center;font-family:inherit}
.err{color:#ffb4a8;font-size:14px;text-align:center;min-height:18px}
.mysenas{display:flex;gap:6px;align-items:center;justify-content:center;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:4px}
.mysenas button{background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.18);color:var(--ink);border-radius:999px;padding:3px 9px;cursor:pointer;font-size:13px}
.mysenas button[aria-pressed="true"]{background:var(--gold);color:#2b1d10;border-color:var(--gold)}

.card{width:var(--cw);height:var(--ch);border-radius:9px;background:var(--paper);box-shadow:0 2px 0 var(--paper-edge),0 6px 14px rgba(0,0,0,.35);position:relative;flex:none;user-select:none}
.card svg{display:block;width:100%;height:100%}
.card img{display:block;width:100%;height:100%;object-fit:cover;border-radius:9px;pointer-events:none}
.deckprev{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin:10px 0}
.deckprev img,.deckprev .miss{width:100%;aspect-ratio:100/152;object-fit:cover;border-radius:4px;background:#eee;display:block}
.deckprev .miss{border:1px dashed #b33;font-size:10px;color:#b33;display:flex;align-items:center;justify-content:center}
.deckform{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center;font-size:14px;margin:8px 0}
.deckform input[type=text],.deckform select,.deckform input[type=number]{font:inherit;padding:4px 6px;border-radius:8px;border:1px solid #cdbf9f;background:#fff}
.deckform .suits{display:flex;gap:6px;flex-wrap:wrap}
.card.play{cursor:pointer;transition:transform .15s, box-shadow .15s}
.card.play:hover{transform:translateY(-12px);box-shadow:0 2px 0 var(--paper-edge),0 16px 24px rgba(0,0,0,.45),0 0 0 3px var(--gold)}
.card.dim{filter:saturate(.75) brightness(.92)}
.hand.me .card{width:100px;height:152px}
.badge{position:absolute;left:50%;bottom:-9px;transform:translateX(-50%);font-size:11px;font-weight:700;padding:1px 7px;border-radius:999px;letter-spacing:.5px;text-transform:uppercase;white-space:nowrap}
.badge.pieza{background:var(--gold);color:#2b1d10}.badge.mata{background:#c7412f;color:#fff}.badge.fio{background:#2f62a8;color:#fff}
.back{width:var(--cw);height:var(--ch);border-radius:9px;flex:none;
  background:repeating-linear-gradient(45deg, rgba(255,255,255,.12) 0 3px, transparent 3px 9px),
    repeating-linear-gradient(-45deg, rgba(255,255,255,.12) 0 3px, transparent 3px 9px),#8e2a22;
  border:5px solid var(--paper);box-shadow:0 6px 14px rgba(0,0,0,.35)}
.winner-card{box-shadow:0 0 0 3px var(--gold),0 6px 14px rgba(0,0,0,.35)}

aside{display:flex;flex-direction:column;gap:14px;margin-top:13px}
.panel{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:14px}
.panel h2{font-family:'Alegreya',serif;font-size:18px;margin:0 0 10px;font-weight:700}
.score{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.score .col{text-align:center}
.score .nm{font-weight:700;font-size:15px}
.score .who2{font-size:12px;color:var(--muted)}
.score .pts{font-family:'Alegreya',serif;font-size:34px;font-weight:800;line-height:1.1}
.score .mb{font-size:12px;color:var(--muted)}
.score svg{width:100%;max-width:150px;height:auto;margin-top:6px}
.chicos{display:flex;justify-content:center;gap:6px;margin-top:4px}
.chicos i{width:12px;height:12px;border-radius:50%;border:2px solid var(--gold);display:inline-block}
.chicos i.on{background:var(--gold)}
.log{max-height:300px;overflow:auto;font-size:14px;display:flex;flex-direction:column;gap:4px;padding-right:4px}
.log .l{line-height:1.3}
.log .l.info{color:var(--muted)}
.log .l.falta{color:#ffb4a8;font-weight:700}
.log .l.sep{margin-top:8px;padding-top:6px;border-top:1px solid rgba(255,255,255,.1);color:var(--gold);font-weight:700}
.log .l b{color:var(--ink)}
.rank-list{font-size:14px;line-height:1.45;color:var(--muted)}
.rank-list b{color:var(--ink)}

.overlay{position:fixed;inset:0;background:rgba(10,6,3,.6);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}
.overlay.tool{z-index:30}
.modal .derr{color:#b3261e;font-weight:600}
.modal{background:var(--paper);color:#2b1d10;border-radius:20px;padding:22px 24px;max-width:540px;width:100%;max-height:92vh;overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.6);animation:pop .3s ease-out}
.modal h3{font-family:'Alegreya',serif;font-size:26px;margin:0 0 8px}
.modal ul{margin:8px 0 12px;padding-left:20px}
.modal .cards{display:flex;gap:8px;margin:6px 0 10px;align-items:center;flex-wrap:wrap}
.modal .cards .card{width:58px;height:88px}
.modal .cards .nm{font-weight:700;font-size:14px;min-width:70px}
.modal .row{display:flex;gap:10px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap}
.modal .act{background:#2b1d10;color:var(--paper)}
.modal .act.sec{background:#e4d9bf;color:#2b1d10}
.modal p{margin:6px 0;line-height:1.4}
.modal .small{font-size:14px;color:#6b5a45}
.modal .pen{background:#fbe3dc;border-radius:12px;padding:10px 12px;margin:8px 0;font-size:15px}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}
.mode{border:2px solid #e4d9bf;border-radius:16px;padding:14px;background:#fff8ea;cursor:pointer;text-align:left;font-size:15px;color:#2b1d10}
.mode:hover{border-color:#c9951a}
.mode b{display:block;font-family:'Alegreya',serif;font-size:20px;margin-bottom:4px}

[hidden]{display:none!important}
.t3d{position:relative;margin:13px;border-radius:24px;overflow:hidden;background:#140e0a;min-width:0;
  box-shadow:0 0 0 10px var(--wood),0 0 0 13px var(--wood2),0 18px 50px rgba(0,0,0,.6);display:flex;flex-direction:column}
.stage{position:relative;height:clamp(400px,60vh,700px);touch-action:none;user-select:none;-webkit-user-select:none;overflow:hidden}
.stage canvas.c3d{display:block;width:100%;height:100%;cursor:grab;outline:none}
.ov3d{position:absolute;inset:0;pointer-events:none}
.l3d{position:absolute;left:0;top:0;display:flex;flex-direction:column;align-items:center;gap:3px;max-width:250px;text-align:center;pointer-events:none;transition:opacity .3s}
.l3d.click{pointer-events:auto;cursor:pointer}
.l3d.side{align-items:flex-start;text-align:left}.l3d.side.sideL{align-items:flex-end;text-align:right}
.l3d.side .senas{flex-direction:column;align-items:inherit}
.l3d.inactive{opacity:.45}
.l3d .nm{font-family:'Alegreya',serif;font-weight:700;font-size:19px;line-height:1.05;text-shadow:0 2px 8px #000,0 0 2px #000}
.l3d .nm small{display:block;font-family:'Alegreya Sans',sans-serif;font-weight:500;font-size:11px;color:var(--muted);letter-spacing:.6px;text-transform:uppercase}
.l3d .tags .tag{background:rgba(0,0,0,.6)}
.l3d .tags .tag.mano,.l3d .tags .tag.turn,.l3d .tags .tag.flor{background:var(--gold);color:#2b1d10}
.l3d .tags .tag.turn{background:#fff}
.l3d .senas{gap:4px}
.l3d .sena{background:rgba(0,0,0,.62);font-size:12px;padding:2px 8px}
.l3d .sena.caught{background:rgba(60,45,10,.75)}
/* lo que dice cada uno: una etiqueta chica pegada al nombre, que se va sola */
.l3d .say,.mybub{background:rgba(251,246,234,.9);color:#2b1d10;font-family:'Alegreya Sans',sans-serif;font-weight:700;font-size:13px;line-height:1.35;
  padding:0 9px;border-radius:999px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .35s}
.l3d .say{max-height:0;overflow:hidden;transition:opacity .35s,max-height .35s}
.l3d .say.on{opacity:1;max-height:24px}
.l3d.side .say{align-self:inherit}
.mybub{position:absolute;left:12px;top:auto}
.mybub.on{opacity:1}
.mue3d{position:absolute;left:0;top:0;font-size:11px;color:var(--gold);text-transform:uppercase;letter-spacing:1.5px;font-weight:700;text-shadow:0 1px 4px #000}
.baz3d{position:absolute;left:12px;top:12px;display:flex;gap:6px;flex-wrap:wrap;max-width:calc(100% - 250px)}
.bz{display:flex;gap:5px;align-items:center;background:rgba(0,0,0,.5);border-radius:999px;padding:3px 4px 3px 10px;font-size:12px}
.bz i{font-style:normal;color:var(--muted)}
.cam3d{position:absolute;left:12px;top:46px;display:flex;gap:6px;pointer-events:auto}
.cam3d .tool{font-size:12px;padding:4px 10px;background:rgba(0,0,0,.45)}
.hint3d{position:absolute;left:14px;top:80px;font-size:12px;color:var(--muted);transition:opacity .8s;text-shadow:0 1px 3px #000}
.hint3d.gone{opacity:0}
.pip3d{position:absolute;pointer-events:none}
.pip3d .frame{border:3px solid var(--gold);border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.6)}
.pip3d .cap{margin-top:6px;background:rgba(0,0,0,.72);border-radius:10px;padding:5px 8px;font-size:13px;text-align:center;line-height:1.3}
.pip3d .cap .ges{color:#f3d27a;font-weight:700;margin-top:2px}
.hud{padding:10px 14px 14px;background:linear-gradient(#1e160f,#150f0a);border-top:1px solid rgba(255,255,255,.08);display:flex;flex-direction:column;gap:6px}
.hud .tags{display:flex;justify-content:center}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}

/* ---------- Pantalla de inicio ---------- */
.home{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px 20px}
.home-in{width:100%;max-width:1120px;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:40px;align-items:center}
.hero{position:relative;border-radius:34px;padding:38px 34px 34px;text-align:center;
  background:radial-gradient(ellipse at 50% 40%, rgba(255,255,255,.09), transparent 62%),
    repeating-linear-gradient(45deg, var(--felt-line) 0 1px, transparent 1px 6px),
    linear-gradient(var(--felt), var(--felt2));
  box-shadow:0 0 0 12px var(--wood),0 0 0 15px var(--wood2),0 24px 60px rgba(0,0,0,.6),inset 0 0 90px rgba(0,0,0,.35)}
.fan{position:relative;height:250px;margin:4px auto 34px;width:330px}
.fan .card{position:absolute;left:50%;bottom:0;--cw:140px;--ch:213px;border-radius:12px;transform-origin:50% 100%;
  box-shadow:0 2px 0 var(--paper-edge),0 14px 28px rgba(0,0,0,.45)}
.fan .card svg,.fan .card img{border-radius:12px}
.fan .f0{transform:translateX(-50%) translateX(-78px) rotate(-14deg)}
.fan .f1{transform:translateX(-50%) translateY(-14px)}
.fan .f2{transform:translateX(-50%) translateX(78px) rotate(14deg)}
.fan.deal .card{animation:dealIn .55s cubic-bezier(.2,.8,.25,1) both}
.fan.deal .f1{animation-delay:.12s}.fan.deal .f2{animation-delay:.24s}
@keyframes dealIn{from{transform:translateX(-50%) translateY(-260px) rotate(0);opacity:0}}
@media (prefers-reduced-motion:reduce){.fan.deal .card{animation:none}}
.htitle{font-family:'Alegreya',serif;font-weight:800;font-size:60px;line-height:.95;letter-spacing:-.5px;margin:0;color:var(--paper);text-shadow:0 3px 14px rgba(0,0,0,.45)}
.hsub{margin:14px auto 0;max-width:34ch;font-size:17px;line-height:1.45;color:#dfe8dc}
.hmain{display:flex;flex-direction:column;gap:22px;min-width:0}
.hmain h2{font-family:'Alegreya',serif;font-weight:700;font-size:23px;margin:0 0 10px}
.cont{display:flex;flex-direction:column;align-items:flex-start;gap:3px;width:100%;text-align:left;cursor:pointer;
  background:var(--gold);color:#2b1d10;border:0;border-radius:18px;padding:16px 20px;box-shadow:0 3px 0 #a87a1c}
.cont b{font-family:'Alegreya',serif;font-size:24px;line-height:1.1}
.cont span{font-size:15px}
.cont:hover{filter:brightness(1.05)}
.hmodes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.hmode{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;cursor:pointer;color:var(--ink);
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.14);border-radius:16px;padding:14px 10px 16px}
.hmode:hover{background:rgba(255,255,255,.1);border-color:rgba(232,177,58,.6)}
.hmode svg{width:88px;height:88px}
.hmode div{display:flex;flex-direction:column;gap:4px;align-items:inherit}
.hmode b{font-family:'Alegreya',serif;font-size:19px;line-height:1.1}
.hmode span{font-size:13.5px;line-height:1.35;color:var(--muted)}
.hconfirm{margin-top:12px;background:rgba(232,177,58,.12);border:1px solid rgba(232,177,58,.45);border-radius:14px;padding:12px 14px}
.hconfirm p{margin:0 0 10px}
.hconfirm .row{display:flex;gap:8px;flex-wrap:wrap}
.hkey{font-size:13px;color:var(--muted);margin:10px 0 0}
.hlinks{display:flex;gap:8px;flex-wrap:wrap}
.hlinks .tool{font-size:15px;padding:9px 16px}
.hbar{display:flex;align-items:center;gap:12px;margin-bottom:4px}
.hbar h2{margin:0}
.cfgsec h3{font-family:'Alegreya',serif;font-weight:700;font-size:18px;margin:0 0 8px;color:var(--paper)}
.cfg{display:grid;grid-template-columns:minmax(120px,auto) 1fr;gap:10px 14px;align-items:center}
.cfg>label,.cfg>.lbl{font-size:15px}
.cfg .desc{grid-column:2;margin-top:-6px;font-size:13px;color:var(--muted);line-height:1.35}
.seg{display:inline-flex;flex-wrap:wrap;gap:4px;background:rgba(0,0,0,.25);border-radius:12px;padding:3px;justify-self:start}
.seg button{border:0;background:transparent;color:var(--ink);font:inherit;font-size:14px;padding:6px 12px;border-radius:9px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--paper);color:#2b1d10;font-weight:700}
.seg button:disabled{opacity:.4;cursor:not-allowed}
.cfg select{font:inherit;font-size:14px;padding:6px 8px;border-radius:9px;border:1px solid rgba(255,255,255,.2);background:#2a1d13;color:var(--ink);justify-self:start;max-width:100%}
.cfgnote{font-size:13.5px;color:var(--muted);margin:8px 0 0}
.home :focus-visible,.tools :focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.hnote{background:rgba(199,65,47,.16);border:1px solid rgba(199,65,47,.5);border-radius:12px;padding:10px 14px;margin:0}
.lob{margin:0 0 14px;line-height:1.45}
.lob .code{font-family:'Alegreya',serif;font-size:26px;letter-spacing:3px;color:var(--gold);padding:0 4px}
.invite{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 10px}
.invite input{flex:1 1 240px;min-width:0;font:inherit;font-size:14px;padding:6px 10px;border-radius:9px;border:1px solid rgba(255,255,255,.2);background:#2a1d13;color:var(--ink)}
.cfg input{font:inherit;font-size:15px;padding:6px 10px;border-radius:9px;border:1px solid rgba(255,255,255,.2);background:#2a1d13;color:var(--ink);justify-self:start;max-width:100%}
.seats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0 8px}
.seats .team{border-radius:14px;padding:10px 12px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1)}
.seats .t0{border-left:5px solid #86b9e6}.seats .t1{border-left:5px solid #8b2335}
.seats h3{font-family:'Alegreya',serif;font-size:16px;margin:0 0 6px}
.seats ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.seats li{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:15px;min-height:30px}
.seats li.me{color:var(--gold)}
.seats small{color:var(--muted)}
.seats .tool{font-size:13px;padding:4px 10px}
.hmain .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
@media (max-width:520px){ .seats{grid-template-columns:1fr} }

@media (max-width:860px){
  .home{align-items:flex-start;padding:30px 22px}
  .home-in{grid-template-columns:1fr;gap:26px}
  .hero{padding:24px 18px 22px;border-radius:26px}
  .fan{height:170px;width:240px;margin-bottom:22px}
  .fan .card{--cw:96px;--ch:146px}
  .fan .f0{transform:translateX(-50%) translateX(-54px) rotate(-14deg)}
  .fan .f2{transform:translateX(-50%) translateX(54px) rotate(14deg)}
  .htitle{font-size:44px}
  .hsub{font-size:15.5px}
}
@media (max-width:520px){
  .hmodes{grid-template-columns:1fr}
  .hmode{flex-direction:row;text-align:left;align-items:center;gap:12px;padding:10px 12px}
  .hmode svg{width:64px;height:64px;flex:none}
  .hmode div{gap:2px;align-items:flex-start}
  .cfg{grid-template-columns:1fr}
  .cfg .desc{grid-column:1}
}

@media (max-width:980px){ .app{grid-template-columns:1fr} }
@media (max-width:640px){
  :root{--cw:58px;--ch:88px}
  .app{padding:8px}
  .table{padding:10px;margin:8px;min-height:0;border-radius:18px}
  .table.four,.table.six{grid-template-columns:64px 1fr 64px;gap:6px}
  .s-left .sena .g,.s-right .sena .g,.s-tl .sena .g,.s-tr .sena .g{display:none}
  .s-left .sena,.s-right .sena,.s-tl .sena,.s-tr .sena{font-size:11px;padding:2px 6px}
  .s-left .who .name,.s-right .who .name,.s-tl .who .name,.s-tr .who .name{font-size:15px}
  .s-tl .who .sub,.s-tr .who .sub{display:none}
  .cross{grid-template-columns:repeat(3,48px);grid-template-rows:repeat(3,46px)}
  .cross .card,.cross .ph{width:48px;height:73px}
  .s-left .who .sub,.s-right .who .sub{display:none}
  .s-left .bubble{left:0}.s-right .bubble{right:0}
  .center{grid-template-columns:1fr}
  .muestra-box{flex-direction:row;justify-content:center}
  .tricks{gap:6px}.slot{min-width:0;padding:4px}
  .hand.me .card{width:78px;height:118px}
  .deckpile{width:72px;height:100px}
  .s-top{min-height:90px}
  .cross{gap:4px 8px}
  .hand.mini .back{width:30px;height:46px;margin-left:-14px}
  .who .name{font-size:17px}
  .bubble{font-size:17px}
  .act{font-size:15px;padding:9px 12px}
  .t3d{margin:8px;border-radius:16px}
  .stage{height:62vh;min-height:360px}
  .l3d .nm{font-size:15px}.l3d .sena{font-size:11px}.l3d .sena .g{display:none}
  .pip3d .cap{font-size:12px}
  .l3d .say,.mybub{font-size:12px}
  .baz3d{max-width:calc(100% - 140px)}
  .modes{grid-template-columns:1fr}
}
</style>
</head>
<body>
<section class="home" id="home" hidden>
  <div class="home-in">
    <div class="hero">
      <div class="fan" id="hfan" aria-hidden="true"></div>
      <h1 class="htitle">Truco Uruguayo</h1>
      <p class="hsub">Contra la computadora, mano a mano, en parejas o en tercetos, con las reglas del Reglamento del Truco Uruguayo.</p>
    </div>
    <div class="hmain" id="hmain"></div>
  </div>
</section>
<div class="app">
  <header class="top">
    <h1>Truco <span>Uruguayo</span><small id="modeLbl"></small></h1>
    <div class="tools">
      <button class="tool" id="btnMenu" title="Volver a la pantalla de inicio (el partido queda en pausa)">Menú</button>
      <button class="tool" id="btnView" title="Cambiar entre la mesa 3D y la mesa 2D">Mesa: 3D</button>
      <button class="tool" id="btnSpeed" title="Cambiar la velocidad de la computadora">Velocidad: normal</button>
      <button class="tool" id="btnHelp" aria-pressed="true">Ayudas</button>
      <button class="tool" id="btnRanks">Jerarquía</button>
    </div>
  </header>
  <main class="table" id="table"></main>
  <main class="t3d" id="t3d" hidden>
    <div class="stage" id="stage">
      <div class="ov3d" id="lbls3d"></div>
      <div class="ov3d">
        <div class="baz3d" id="baz3d"></div>
        <div class="cam3d"><button class="tool" id="cam3dMine" title="Volver a mirar desde tu lugar (doble clic)">Tu lugar</button><button class="tool" id="cam3dTop" title="Ver la mesa desde arriba">Desde arriba</button></div>
        <div class="hint3d" id="hint3d">Arrastrá para girar la mesa · rueda o pellizco para acercar</div>
        <div class="mue3d" id="mue3d">Muestra</div>
        <div class="mybub" id="mybub3d"></div>
        <div class="pip3d" id="pip3d" hidden><div class="frame"></div><div class="cap"></div></div>
      </div>
    </div>
    <section class="hud" id="hud" aria-live="polite"></section>
  </main>
  <aside>
    <div class="panel"><h2>Tanteador</h2><div class="score" id="score"></div></div>
    <div class="panel" id="ranksPanel" hidden><h2>Jerarquía con esta muestra</h2><div class="rank-list" id="ranks"></div></div>
    <div class="panel"><h2>Lo que se dijo</h2><div class="log" id="log" aria-live="polite"></div></div>
  </aside>
</div>
<div id="overlay"></div>
<div id="overlay2"></div>

<script>
// Motor de reglas del Truco Uruguayo, según el Reglamento.
// Mano a mano (2), parejas (4) o tercetos (6). Equipo de un jugador = p % 2.
// Asientos: 0 = humano (abajo) y se sigue hacia la derecha: el siguiente de p es (p + 1) % n.
// Jerga: tocar = envido, gritar = truco, cantar = flor (o los tantos).
// Reglas de la mesa (G.rules): variantes que cambian según dónde se juegue.
// Modo realista (G.manual[p]): el jugador canta sus puntos, puede negar la flor o
// cantarla sin tenerla. Las faltas se descubren cuando se ven sus cartas.
(function (global) {
  'use strict';

  let rng = Math.random;
  function setRng(f) { rng = f; }

  const SUITS = ['oro', 'copa', 'espada', 'basto'];
  const NUMS = [1, 2, 3, 4, 5, 6, 7, 10, 11, 12];
  const PIEZA_ORDER = [2, 4, 5, 11, 10];
  const PIEZA_ENV = { 2: 30, 4: 29, 5: 28, 11: 27, 10: 27 };
  const TRUCO_NAMES = { 2: 'Truco', 3: 'Retruco', 4: 'Vale cuatro' };
  const FIG = { 10: 'Sota', 11: 'Caballo', 12: 'Rey' };
  const DEFAULT_RULES = {
    target: 40,               // Art. 4 (en muchas mesas se juega a 30)
    chicosToWin: 2,           // al mejor de tres chicos (1 = un solo chico)
    flor: true,               // con o sin flor
    florCompanero: 'niega',   // si tu compañero toca y tenés flor: 'niega' o 'tengo' (decís "tengo flor")
    iguales: 'parda',         // cartas iguales de rivales: 'parda' (Art. 57) o 'mano' (Art. 12, gana el más mano)
    senas: true,              // señas entre compañeros (Art. 102)
    mazo: 'solo',             // irse al mazo sin ser el pie: 'solo' (sale ese jugador) o 'equipo' (Art. 90)
  };
  const LEY_FORMS = {
    todo: 'Todo dicho', falta: 'La falta envido', resto: 'El resto', falta_resto: 'Falta envido y resto',
    falta_truco: 'La falta envido y el truco', truco: 'El truco', resto_truco: 'Resto y truco',
  };

  function makeDeck() {
    const d = [];
    for (const s of SUITS) for (const n of NUMS) d.push({ n, s, id: n + '-' + s });
    return d;
  }
  function shuffle(a) {
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(rng() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  // ---- Valores (Cap. II) ----
  function piezaRole(c, m) {
    if (c.s !== m.s) return null;
    if (PIEZA_ORDER.includes(c.n)) return c.n;
    if (c.n === 12 && PIEZA_ORDER.includes(m.n)) return m.n;
    return null;
  }
  function isPieza(c, m) { return piezaRole(c, m) !== null; }
  function rank(c, m) {
    const r = piezaRole(c, m);
    if (r !== null) return 100 - PIEZA_ORDER.indexOf(r);
    if (c.n === 1 && c.s === 'espada') return 90;
    if (c.n === 1 && c.s === 'basto') return 89;
    if (c.n === 7 && c.s === 'espada') return 88;
    if (c.n === 7 && c.s === 'oro') return 87;
    if (c.n === 3) return 80;
    if (c.n === 2) return 79;
    if (c.n === 1) return 78;
    return { 12: 70, 11: 69, 10: 68, 7: 67, 6: 66, 5: 65, 4: 64 }[c.n];
  }
  function category(c, m) {
    const r = rank(c, m);
    if (r >= 96) return 'pieza';
    if (r >= 87) return 'mata';
    if (r >= 78) return 'fio';
    return c.n >= 10 ? 'negra' : 'blanca';
  }
  function envVal(c, m) {
    const r = piezaRole(c, m);
    if (r !== null) return PIEZA_ENV[r];
    if (c.n >= 10) return 0;
    return c.n;
  }
  function hasFlor(cards, m) {
    const p = cards.filter(c => isPieza(c, m));
    const o = cards.filter(c => !isPieza(c, m));
    if (p.length >= 2) return true;
    if (p.length === 1) return o[0].s === o[1].s;
    return o[0].s === o[1].s && o[1].s === o[2].s;
  }
  function florPoints(cards, m) {
    const p = cards.filter(c => isPieza(c, m)).map(c => envVal(c, m)).sort((a, b) => b - a);
    const o = cards.filter(c => !isPieza(c, m)).map(c => envVal(c, m));
    if (p.length === 3) return p[0] + (p[1] - 20) + (p[2] - 20);
    if (p.length === 2) return p[0] + (p[1] - 20) + o[0];
    if (p.length === 1) return p[0] + o[0] + o[1];
    return 20 + o[0] + o[1] + o[2];
  }
  function envidoPoints(cards, m) {
    const p = cards.filter(c => isPieza(c, m)).sort((a, b) => envVal(b, m) - envVal(a, m));
    const o = cards.filter(c => !isPieza(c, m));
    if (p.length >= 1) {
      const rest = cards.filter(c => c !== p[0]).map(c => isPieza(c, m) ? envVal(c, m) - 20 : envVal(c, m));
      return Math.min(37, envVal(p[0], m) + Math.max(...rest));
    }
    let best = -1;
    for (let i = 0; i < 3; i++) for (let j = i + 1; j < 3; j++) {
      if (o[i].s === o[j].s) best = Math.max(best, 20 + envVal(o[i], m) + envVal(o[j], m));
    }
    if (best >= 0) return best;
    return Math.max(...o.map(c => envVal(c, m)));
  }
  function cardName(c) {
    const n = FIG[c.n] || (c.n === 1 ? 'As' : String(c.n));
    return n + ' de ' + c.s;
  }

  // ---- Señas (Art. 102) ----
  const SENAS = {
    '2': { gesto: 'levanta las cejas', cartas: 'el dos' },
    '4': { gesto: 'adelanta los labios', cartas: 'el cuatro' },
    '5': { gesto: 'frunce la nariz', cartas: 'el cinco' },
    'perico': { gesto: 'guiña un ojo', cartas: 'perico o perica' },
    'mata': { gesto: 'tuerce los labios', cartas: 'una mata' },
    '3': { gesto: 'se muerde el labio', cartas: 'un tres' },
    'fio': { gesto: 'abre un poco la boca', cartas: 'un dos o un as' },
    'nada': { gesto: 'cierra los ojos', cartas: 'nada de valor' },
  };
  function senaOf(c, m) {
    const r = piezaRole(c, m);
    if (r === 2 || r === 4 || r === 5) return String(r);
    if (r === 11 || r === 10) return 'perico';
    const cat = category(c, m);
    if (cat === 'mata') return 'mata';
    if (c.n === 3) return '3';
    if (cat === 'fio') return 'fio';
    return null;
  }
  function senasFor(cards, m) {
    const out = [];
    for (const c of cards) { const s = senaOf(c, m); if (s && !out.includes(s)) out.push(s); }
    return out.length ? out : ['nada'];
  }

  // ---- Bazas (Arts. 57–59). w: equipo ganador de cada baza o -1 (parda) ----
  function roundWinner(w, manoTeam) {
    if (w.length >= 2) {
      const [a, b] = w;
      if (a !== -1 && (b === a || b === -1)) return a;
      if (a === -1 && b !== -1) return b;
    }
    if (w.length === 3) {
      const [a, b, c] = w;
      if (a !== -1 && b !== -1) return c !== -1 ? c : a;
      return c !== -1 ? c : manoTeam;
    }
    return null;
  }

  function validCanto(kind, n) {
    if (!Number.isInteger(n)) return false;
    if (kind === 'flor') return n >= 20 && n <= 47;
    return (n >= 0 && n <= 7) || (n >= 20 && n <= 37);
  }

  // ---- Partido ----
  const NAMES = { 2: ['Vos', 'Computadora'], 4: ['Vos', 'Tito', 'Pocho', 'Nacho'], 6: ['Vos', 'Tito', 'Pocho', 'Nacho', 'Lalo', 'Beto'] };
  function newMatch(opts) {
    opts = opts || {};
    const n = [2, 4, 6].includes(opts.players) ? opts.players : 2;
    const rules = Object.assign({}, DEFAULT_RULES, opts.rules || {});
    const names = opts.names || NAMES[n].slice();
    return {
      n, rules,
      target: rules.target, chicosToWin: rules.chicosToWin,
      scores: [0, 0], chicos: [0, 0],
      dealer: Math.floor(rng() * n),
      manual: (opts.manual || []).concat(Array(n).fill(false)).slice(0, n),
      humans: opts.humans || [0],
      round: null, phase: 'idle', log: [], roundNo: 0, roundInChico: 0,
      matchWinner: null, chicoWinner: null, disq: null,
      names,
      teamNames: opts.teamNames || (n === 2 ? names.slice() : ['Nosotros', 'Ellos']),
      memory: { lies: {}, bluff: {} },
    };
  }
  const team = p => p % 2;
  const nxt = (G, p) => (p + 1) % G.n;
  function pos(G, p) { return (p - G.round.mano + G.n) % G.n; }
  function inGame(R, q) { return R.active[q] && !R.out[q]; }
  function fromMano(G) {
    const R = G.round, o = [];
    for (let i = 0; i < G.n; i++) { const q = (R.mano + i) % G.n; if (inGame(R, q)) o.push(q); }
    return o;
  }
  function firstInGameFrom(G, p) {
    const R = G.round;
    for (let i = 0; i < G.n; i++) { const q = (p + i) % G.n; if (inGame(R, q)) return q; }
    return p;
  }
  function nextIn(G, p) { return firstInGameFrom(G, nxt(G, p)); }
  // El pie es el último de su equipo en jugar (entre los que siguen en juego)
  function esPie(G, p) { return !fromMano(G).some(q => q !== p && team(q) === team(p) && pos(G, q) > pos(G, p)); }
  function trickComplete(G) { const R = G.round; return fromMano(G).every(q => R.cur[q] !== null); }

  function say(G, who, text) {
    G.log.push({ who, text, kind: 'canto', round: G.roundNo });
    if (G.round) G.round.said[who] = { text, t: G.log.length };
  }
  function info(G, text, kind) { G.log.push({ who: null, text, kind: kind || 'info', round: G.roundNo }); }

  function roundType(G) {
    // Art. 83–84: en tercetos, hasta la mitad del chico se alternan rondas generales y mano a mano
    if (G.n !== 6) return 'general';
    if (Math.max(G.scores[0], G.scores[1]) >= G.target / 2) return 'general';
    return G.roundInChico % 2 === 1 ? 'duelos' : 'general';
  }

  function startRound(G, presetDeck) {
    const n = G.n;
    if (G.round) G.dealer = nxt(G, G.dealer);
    G.roundNo++;
    G.chicoWinner = null;
    const deck = presetDeck ? presetDeck.slice() : shuffle(makeDeck());
    const mano = nxt(G, G.dealer);
    const hands = Array.from({ length: n }, () => []);
    for (let r = 0; r < 3; r++) for (let i = 0; i < n; i++) hands[(mano + i) % n].push(deck.pop());
    const muestra = deck.pop();
    const type = roundType(G);
    G.roundInChico++;
    const conFlor = G.rules.flor;
    const R = {
      type, hands, muestra, dealMano: mano,
      initial: hands.map(h => h.slice()),
      florHas: hands.map(h => conFlor && hasFlor(h, muestra)),
      florPts: hands.map(h => (conFlor && hasFlor(h, muestra)) ? florPoints(h, muestra) : 0),
      envPts: hands.map(h => envidoPoints(h, muestra)),
      senas: hands.map(h => senasFor(h, muestra)),
      senasShown: Array(n).fill(null),
      seen: Array.from({ length: n }, () => []),
      duel: null, ley: null, leyPhase: null,
    };
    G.round = R;
    if (type === 'duelos') {
      R.duel = { pairs: [0, 1, 2].map(k => [(mano + k) % n, (mano + k + 3) % n]), idx: 0 };
      initPlay(G, R.duel.pairs[0], R.duel.pairs[0][0]);
    } else {
      initPlay(G, Array.from({ length: n }, (_, i) => i), mano);
      if (G.rules.senas && n >= 4) {
        for (let p = 0; p < n; p++) if (!G.humans.includes(p)) R.senasShown[p] = R.senas[p].slice();
        for (let p = 0; p < n; p++) if (R.senasShown[p]) catchSenas(G, R, p, R.senasShown[p]);
      }
      if (leyDisponible(G)) {
        // Art. 71: tiene preferencia el equipo que va perdiendo; con el tanteador igualado, el del mano
        const t = G.scores[0] < G.scores[1] ? 0 : G.scores[1] < G.scores[0] ? 1 : team(mano);
        R.leyPhase = { team: t, decider: preferHuman(G, fromMano(G).filter(q => team(q) === t)) };
      }
    }
    G.phase = 'play';
    info(G, `Mano ${G.roundNo}. Da ${G.names[G.dealer]}, es mano ${G.names[mano]}.` + (R.leyPhase ? '' : ` Muestra: ${cardName(muestra)}.`));
    if (R.duel) info(G, `Ronda mano a mano (Art. 83): ${duelLabel(G)}.`);
    return G;
  }
  // A ley de juego: en parejas y tercetos, cuando algún equipo ya entró en buenas
  function leyDisponible(G) { return G.n >= 4 && Math.max(G.scores[0], G.scores[1]) > G.target / 2; }
  function duelLabel(G) {
    const R = G.round, [a, b] = R.duel.pairs[R.duel.idx];
    return `${G.names[a]} contra ${G.names[b]}`;
  }
  function preferHuman(G, list) {
    const h = list.find(q => G.humans.includes(q));
    return h !== undefined ? h : list[0];
  }

  // Estado de juego de una mano (o de cada duelo en tercetos)
  function initPlay(G, active, mano) {
    const R = G.round, n = G.n, arr = v => Array(n).fill(v);
    R.active = arr(false); active.forEach(p => R.active[p] = true);
    R.out = arr(false);
    R.mano = mano;
    R.tricks = []; R.cur = arr(null); R.turn = mano; R.trickLeader = mano;
    R.pending = [];
    R.trucoLevel = 1; R.trucoOwner = null;
    R.saidTruco = [false, false]; R.saidQuiero = [false, false];
    R.played = arr(0); R.acted = arr(false); R.trucoCalls = arr(0);
    R.falta = G.target - Math.max(G.scores[0], G.scores[1]);
    if (R.duel) R.falta = Math.min(R.falta, 10); // Art. 86
    R.flor = {
      has: R.florHas.map((h, q) => h && R.active[q]), pts: R.florPts.slice(),
      sung: arr(false), negada: arr(false), lost: arr(false), achico: [false, false], sungPts: {}, declined: {},
    };
    R.florQueue = []; R.florEnv = null;
    R.envido = { done: false, result: null };
    R.canto = null;
    R.faults = Array.from({ length: n }, () => []);
    R.wonEnvite = [false, false];
    R.mustShow = arr(false);
    R.said = arr(null);
    R.result = null; R.penalty = null;
    R.gained = [[], []];
  }

  // Señas: cuando p le hace señas a sus compañeros, cada rival puede pescar una (una vez por mano).
  const CATCH = 0.2;
  function catchSenas(G, R, p, list) {
    if (G.n < 4 || !list.length) return;
    for (let o = 0; o < G.n; o++) {
      if (team(o) === team(p) || R.seen[o].some(x => x.p === p)) continue;
      if (rng() < CATCH) R.seen[o].push({ p, s: list[Math.floor(rng() * list.length)] });
    }
  }
  function setSenas(G, p, list) {
    const R = G.round;
    if (!R || !G.rules.senas || R.duel) return;
    const prev = R.senasShown[p] || [];
    R.senasShown[p] = list.slice();
    const nuevas = list.filter(s => !prev.includes(s));
    if (nuevas.length) catchSenas(G, R, p, nuevas);
  }

  function florDecider(G, t) {
    const R = G.round;
    return preferHuman(G, fromMano(G).filter(q => team(q) === t && R.flor.sung[q]));
  }

  function actor(G) {
    const R = G.round;
    if (!R || G.phase !== 'play') return null;
    if (R.leyPhase) return R.leyPhase.decider;
    if (R.ley && R.ley.pendingResp) return R.ley.responder;
    if (R.canto) return R.canto.cur;
    if (R.florQueue.length) return R.florQueue[0];
    const top = R.pending[R.pending.length - 1];
    if (top && top.kind === 'fenv') return top.to;
    if (R.florEnv && !R.florEnv.done) return florDecider(G, R.florEnv.curTeam);
    if (top) return top.to;
    return R.turn;
  }

  function florCandidate(G, q) {
    const R = G.round, f = R.flor;
    return f.has[q] && !f.sung[q] && !f.negada[q] && !f.lost[q] && inGame(R, q);
  }
  function anyFlorSung(R) { return R.flor.sung.some(x => x); }
  function mustSingFlor(G, p) { return !G.manual[p] && florCandidate(G, p); }
  function canOfferFlor(G, p) {
    const R = G.round;
    return G.rules.flor && G.manual[p] && !R.flor.sung[p] && !R.flor.negada[p] && !R.flor.lost[p] && !R.acted[p] && R.played[p] === 0;
  }

  function canEnvidar(G, p) {
    const R = G.round, t = team(p);
    if (anyFlorSung(R) || R.envido.done || !inGame(R, p)) return false;
    if (R.played[p] > 0) return false;                       // Art. 22 b)
    if (R.saidTruco[t] || R.saidQuiero[t]) return false;     // Art. 22 c) y d)
    if (R.pending.some(x => x.kind === 'env' || x.kind === 'fenv')) return false;
    if (R.pending.length === 0) return R.turn === p;
    const top = R.pending[R.pending.length - 1];
    return R.pending.length === 1 && top.kind === 'truco' && top.to === p && top.level === 2;
  }
  function canReenvidar(G, p) { const t = team(p); return !G.round.saidTruco[t] && !G.round.saidQuiero[t]; }

  function numAmt(b) { return typeof b.amt === 'number' ? b.amt : 0; }
  function betTotal(bets, falta) {
    if (!bets.length) return 0;
    if (bets.some(b => b.amt === 'falta' || b.amt === 'resto')) return falta;
    const s = bets.reduce((a, b) => a + b.amt, 0);
    return Math.min(s, Math.max(falta, 2));
  }
  function lastNum(bets) { return bets.length ? numAmt(bets[bets.length - 1]) : 0; }

  function envOptions(G, p, bets) {
    const R = G.round, out = [];
    if (bets.some(b => b.amt === 'falta')) return out;
    const prev = bets.reduce((a, b) => a + b.amt, 0);
    const e = Math.max(2, lastNum(bets)), r = Math.max(3, lastNum(bets));
    if (prev + e < R.falta || !bets.length) out.push({ type: 'envido', kind: 'envido', amt: e });
    if (prev + r < R.falta) out.push({ type: 'envido', kind: 'real', amt: r });
    out.push({ type: 'envido', kind: 'falta', amt: 'falta' });
    return out;
  }
  function fenvOptions(G, p, bets) {
    const R = G.round, out = [];
    if (bets.some(b => b.amt === 'falta' || b.amt === 'resto')) return out;
    const contra = bets.some(b => b.contra);
    const prev = bets.reduce((a, b) => a + b.amt, 0);
    const e = Math.max(2, lastNum(bets));
    const ok = prev + e < R.falta || !bets.length;
    if (!contra && ok) out.push({ type: 'fenv', amt: e, contra: false });
    if (!contra) out.push({ type: 'fenv', amt: 'falta', contra: false });
    if (ok) out.push({ type: 'fenv', amt: e, contra: true });
    out.push({ type: 'fenv', amt: 'resto', contra: true });
    return out;
  }

  function beats(G, pts, p, best) {
    if (!best) return true;
    return pts > best.pts || (pts === best.pts && pos(G, p) < pos(G, best.p));
  }
  function realCanto(G, p) { const R = G.round; return R.canto.kind === 'flor' ? R.flor.pts[p] : R.envPts[p]; }
  function autoCantoAction(G, p) {
    const real = realCanto(G, p), best = G.round.canto.best;
    return beats(G, real, p, best) ? { type: 'sing', pts: real } : { type: 'buenas' };
  }

  // Quién contesta un desafío de p: un rival en juego (si needCard, que no haya jugado en esta baza).
  // Si el humano puede contestar, contesta él.
  function rivalResponder(G, p, needCard) {
    const R = G.round, cands = [];
    for (let i = 1; i < G.n; i++) {
      const q = (p + i) % G.n;
      if (team(q) !== team(p) && inGame(R, q) && (!needCard || R.cur[q] === null)) cands.push(q);
    }
    if (cands.length) return preferHuman(G, cands);
    for (let i = 1; i < G.n; i++) { const q = (p + i) % G.n; if (team(q) !== team(p) && inGame(R, q)) return q; }
    return nxt(G, p);
  }

  function legal(G, p) {
    if (G.phase !== 'play' || actor(G) !== p) return [];
    const R = G.round;
    if (R.leyPhase) return Object.keys(LEY_FORMS).map(form => ({ type: 'ley', form })).concat([{ type: 'noley' }]);
    if (R.ley && R.ley.pendingResp) {
      const L = R.ley, out = [];
      for (const e of L.envPart ? [true, false] : [false]) for (const t of L.truco ? [true, false] : [false]) out.push({ type: 'leyresp', env: e, truco: t });
      return out;
    }
    if (R.canto) {
      if (!G.manual[p]) return [autoCantoAction(G, p)];
      const acts = [{ type: 'sing', pts: null }];
      if (R.canto.best) acts.push({ type: 'buenas' });
      return acts;
    }
    if (R.florQueue.length) return G.manual[p] ? [{ type: 'flor' }, { type: 'noflor' }] : [{ type: 'flor' }];
    if (mustSingFlor(G, p)) return [{ type: 'flor' }];
    const extra = canOfferFlor(G, p) ? [{ type: 'flor' }] : [];
    const top = R.pending[R.pending.length - 1];
    if (top && top.kind === 'fenv') {
      const acts = [{ type: 'quiero' }, { type: 'noquiero' }];
      if (!R.flor.achico[team(p)]) acts.push(...fenvOptions(G, p, top.bets));
      return acts;
    }
    if (R.florEnv && !R.florEnv.done) {
      const acts = R.flor.achico[team(p)] ? [] : fenvOptions(G, p, []);
      acts.push({ type: 'chica' });
      return acts;
    }
    if (top) {
      const acts = extra.concat([{ type: 'quiero' }, { type: 'noquiero' }]);
      if (top.kind === 'truco') {
        if (top.level < 4 && R.cur[p] === null) acts.push({ type: 'truco', level: top.level + 1 });
        if (canEnvidar(G, p)) acts.push(...envOptions(G, p, []));
      } else if (top.kind === 'env') {
        if (canReenvidar(G, p)) acts.push(...envOptions(G, p, top.bets));
      }
      return acts;
    }
    const acts = extra.concat(R.hands[p].map(c => ({ type: 'play', card: c })));
    if (R.trucoLevel < 4 && (R.trucoOwner === null || R.trucoOwner === team(p)))
      acts.push({ type: 'truco', level: R.trucoLevel + 1 });
    if (canEnvidar(G, p)) acts.push(...envOptions(G, p, []));
    // Art. 88/92: "paso" sale de la mano sin arrastrar al equipo (si queda algún compañero en juego)
    if (G.n >= 4 && fromMano(G).some(q => q !== p && team(q) === team(p))) acts.push({ type: 'paso' });
    acts.push({ type: 'mazo' });
    return acts;
  }

  function label(G, a) {
    switch (a.type) {
      case 'play': return cardName(a.card);
      case 'truco': return TRUCO_NAMES[a.level];
      case 'envido': {
        const raise = G.round.pending.some(x => x.kind === 'env');
        if (a.kind === 'falta') return 'Falta envido';
        const base = a.kind === 'real' ? 'Real envido' : 'Envido';
        return raise ? `${base} (+${a.amt})` : base;
      }
      case 'fenv': {
        const raise = G.round.pending.some(x => x.kind === 'fenv');
        if (a.amt === 'resto') return 'Contra flor el resto';
        if (a.amt === 'falta') return 'Con flor la falta envido';
        const base = a.contra ? 'Contra flor envido' : 'Con flor envido';
        return raise ? `${base} (+${a.amt})` : base;
      }
      case 'quiero': return 'Quiero';
      case 'noquiero': return 'No quiero';
      case 'chica': return 'Con flor me achico';
      case 'mazo': {
        const R = G.round, p = actor(G);
        if (G.n === 2 || p === null) return 'Me voy al mazo';
        return (!esPie(G, p) && G.rules.mazo === 'solo') ? 'Me voy al mazo (sigue mi equipo)' : 'Me voy al mazo (pierde el equipo)';
      }
      case 'paso': return 'Paso';
      case 'flor': return '¡Flor!';
      case 'noflor': return 'Seguir sin cantar';
      case 'sing': return a.pts === null ? 'Cantar' : String(a.pts);
      case 'buenas': return 'Son buenas';
      case 'ley': return LEY_FORMS[a.form];
      case 'noley': return 'Jugar normal';
      case 'leyresp': {
        const L = G.round.ley;
        if (L.envPart && L.truco) return a.env && a.truco ? 'Quiero todo' : a.env ? 'Quiero el envite, no el truco' : a.truco ? 'Quiero el truco, no el envite' : 'Paso (no quiero nada)';
        return (a.env || a.truco) ? 'Quiero' : 'Paso (no quiero)';
      }
    }
    return a.type;
  }

  function addPoints(G, t, pts, why, cat) {
    if (pts <= 0) return;
    G.scores[t] += pts;
    G.round.gained[t].push({ pts, why, cat: cat || 'otro' });
    info(G, `${G.teamNames[t]} +${pts} (${why}).`);
  }
  function checkChico(G) {
    if (G.matchWinner !== null) return true;
    for (const t of [0, 1]) {
      if (G.scores[t] >= G.target) {
        G.chicos[t]++;
        G.chicoWinner = t;
        const gana = G.n === 2 ? (t === 0 && G.names[0] === 'Vos' ? 'ganás' : 'gana') : (G.teamNames[t] === 'Nosotros' ? 'ganamos' : 'ganan');
        info(G, `${G.teamNames[t]} ${gana} el chico ${G.scores[t]} a ${G.scores[1 - t]}.`);
        if (G.chicos[t] >= G.chicosToWin) G.matchWinner = t;
        return true;
      }
    }
    return false;
  }

  // Lo que la computadora puede recordar: señas que resultaron falsas y faroles al truco
  function updateMemory(G) {
    const R = G.round, M = G.memory;
    for (let p = 0; p < G.n; p++) {
      if (!R.active[p]) continue;
      const known = R.played[p] === 3 || R.mustShow[p];
      if (!known) continue;
      const truth = R.senas[p];
      const claims = (R.senasShown[p] || []).slice();
      R.seen.forEach(list => list.forEach(v => { if (v.p === p) claims.push(v.s); }));
      if (claims.some(s => !truth.includes(s))) M.lies[p] = (M.lies[p] || 0) + 1;
      if (R.trucoCalls[p] > 0) {
        const b = M.bluff[p] || (M.bluff[p] = { calls: 0, weak: 0 });
        b.calls++;
        if (!R.initial[p].some(c => rank(c, R.muestra) >= 87)) b.weak++;
      }
    }
  }

  function endRound(G, reason) {
    const R = G.round;
    R.result = R.result || { reason };
    updateMemory(G);
    if (G.matchWinner !== null) G.phase = 'matchEnd';
    else if (G.chicoWinner !== null) G.phase = 'chicoEnd';
    else if (R.duel && R.duel.idx < R.duel.pairs.length - 1) G.phase = 'duelEnd';

  }

    return false;
  }

  // ---- Penas (Art. 46) y faltas graves (Art. 100) ----
  function penalize(G, off, reason) {
    const R = G.round, ot = 1 - team(off);
    for (const t of [0, 1]) {
      const g = R.gained[t].reduce((a, x) => a + x.pts, 0);
      if (g) { G.scores[t] -= g; R.gained[t] = []; }
    }
    let envStake = 0;
    if (R.canto && R.canto.stake) envStake = R.canto.stake;
    else if (R.envido.result) envStake = R.envido.result.pts;
    else if (R.florEnv && R.florEnv.result) envStake = R.florEnv.result.stake || 0;
    else {
      const top = R.pending.find(x => x.kind === 'env' || x.kind === 'fenv');
      if (top) envStake = betTotal(top.bets, R.falta);
    }
    const flores = R.flor.sung.filter(x => x).length + R.flor.negada.filter(x => x).length;
    const truco = R.trucoLevel > 1 ? R.trucoLevel : 1;
    const total = envStake + 3 * flores + truco;
    R.canto = null; R.pending = []; R.florQueue = []; if (R.ley) R.ley.afterCanto = null;
    R.mustShow[off] = true;
    R.penalty = { off, reason, envStake, flores, truco, total };
    info(G, `${G.names[off]}: ${reason}. Su equipo pierde lo de esta mano (Art. 46).`, 'falta');
    R.result = { winnerTeam: ot, pts: total, reason: 'penalty' };
    addPoints(G, ot, total, 'pena por ' + reason, 'pena');
    checkChico(G);
    endRound(G, 'penalty');
  }
  function faltaGrave(G, off, reason) {
    const R = G.round;
    G.disq = { p: off, team: team(off), reason };
    G.matchWinner = 1 - team(off);
    R.mustShow[off] = true;
    R.result = { winnerTeam: 1 - team(off), pts: 0, reason: 'disq' };
    info(G, `Falta grave de ${G.names[off]}: ${reason} (Art. 100). Su equipo queda descalificado.`, 'falta');
    endRound(G, 'disq');
  }
  function reveal(G, p) {
    const R = G.round, f = R.faults[p];
    if (!f.length) return false;
    if (f.includes('negada')) {
      if (R.wonEnvite[team(p)]) faltaGrave(G, p, 'ganó un envite teniendo flor y negándola');
      else penalize(G, p, 'flor negada');
    } else penalize(G, p, 'canto errado');
    return true;
  }

  function winTruco(G, t, pts, why) {
    const R = G.round;
    for (let p = 0; p < G.n; p++) if (R.played[p] === 3 && reveal(G, p)) return;
    R.result = { winnerTeam: t, pts, reason: why };
    addPoints(G, t, pts, why, 'truco');
    checkChico(G);
    endRound(G, why);
  }

  // ---- Canto de los puntos (Cap. V) ----
  function startCanto(G, kind, ctx, stake) {
    const R = G.round;
    const order = fromMano(G).filter(q => kind !== 'flor' || R.flor.sung[q]);
    R.canto = { kind, ctx, stake, order, best: null, sung: {}, declined: {}, lastIdx: -1, cur: order[0] };
    runAutoCanto(G);
  }
  function cantoNext(G) {
    const c = G.round.canto, L = c.order.length;
    for (let k = 1; k <= L; k++) {
      const q = c.order[(c.lastIdx + k) % L];
      if (team(q) !== team(c.best.p) && c.sung[q] === undefined && c.declined[q] === undefined) return q;
    }
    return null;
  }
  function runAutoCanto(G) {
    const R = G.round;
    while (R.canto && G.phase === 'play' && R.canto.cur !== null && !G.manual[R.canto.cur]) {
      applyCanto(G, R.canto.cur, autoCantoAction(G, R.canto.cur));
    }
  }
  function applyCanto(G, p, a) {
    const R = G.round, c = R.canto;
    if (a.type === 'sing') {
      if (!validCanto(c.kind, a.pts)) throw new Error('Esa cifra no vale como canto (Art. 43)');
      if (!beats(G, a.pts, p, c.best)) throw new Error('Tenés que cantar más de lo que ya se cantó, o decir "son buenas" (Art. 44)');
      c.sung[p] = a.pts;
      say(G, p, c.best ? `${a.pts} son mejores` : String(a.pts));
      c.best = { p, pts: a.pts };
    } else {
      if (!c.best) throw new Error('El mano tiene que cantar su punto (Art. 39)');
      c.declined[p] = { p: c.best.p, pts: c.best.pts };
      say(G, p, 'Son buenas');
    }
    c.lastIdx = c.order.indexOf(p);
    c.cur = cantoNext(G);
    if (c.cur === null) finishCanto(G);
  }
  function finishCanto(G) {
    const R = G.round, c = R.canto;
    const w = c.best.p, wt = team(w);
    for (const q of c.order) {
      const real = realCanto(G, q);
      const errado = c.sung[q] !== undefined ? c.sung[q] !== real
        : c.declined[q] !== undefined ? beats(G, real, q, c.declined[q]) : false;
      if (errado && !R.faults[q].includes('errado')) R.faults[q].push('errado');
    }
    if (c.kind === 'flor') { R.flor.sungPts = Object.assign({}, c.sung); R.flor.declined = Object.assign({}, c.declined); }
    R.mustShow[w] = true;
    const ctx = c.ctx;
    if (ctx.type === 'env') {
      R.envido.result = { winner: w, team: wt, pts: c.stake, accepted: true, sung: Object.assign({}, c.sung), declined: Object.assign({}, c.declined) };
      R.wonEnvite[wt] = true;
      if (reveal(G, w)) return;
      R.canto = null;
      addPoints(G, wt, c.stake, 'envido', 'envido');
    } else {
      if (ctx.type === 'fenv') R.wonEnvite[wt] = true;
      if (reveal(G, w)) return;
      R.canto = null;
      const F = florCount(G);
      if (ctx.type === 'fenv') {
        const contra = ctx.bets.some(b => b.contra);
        const pts = c.stake + 3 * F[wt] + (contra ? 3 * F[1 - wt] : 0);
        R.florEnv.result = { winner: w, pts, stake: c.stake };
        addPoints(G, wt, pts, contra ? 'contra flor' : 'con flor envido', 'flor');
      } else {
        R.florEnv.result = { winner: w, pts: 3 * F[wt], stake: 0 };
        addPoints(G, wt, 3 * F[wt], 'flor mayor', 'flor');
      }
    }
    if (afterPoints(G)) return;
    if (R.ley && R.ley.afterCanto) { const tr = R.ley.afterCanto; R.ley.afterCanto = null; leyTruco(G, tr.truco); }
  }
  function florCount(G) {
    const R = G.round, F = [0, 0];
    R.flor.sung.forEach((s, q) => { if (s && R.flor.has[q]) F[team(q)]++; });
    return F;
  }

  function resolveEnvido(G, bets, accepted) {
    const R = G.round;
    R.envido.done = true;
    if (!accepted) {
      const last = bets[bets.length - 1], t = team(last.by);
      const pts = bets.length === 1 ? 1 : betTotal(bets.slice(0, -1), R.falta);
      R.envido.result = { winner: last.by, team: t, pts, accepted: false };
      R.wonEnvite[t] = true;
      addPoints(G, t, pts, 'envido no querido', 'envido');
      afterPoints(G);
      return;
    }
    startCanto(G, 'env', { type: 'env' }, betTotal(bets, R.falta));
  }
  function resolveFlorEnv(G, bets, accepted) {
    const R = G.round;
    R.florEnv.done = true;
    if (!accepted) {
      const last = bets[bets.length - 1], t = team(last.by);
      const contraPrev = bets.slice(0, -1).some(b => b.contra);
      const F = florCount(G);
      let pts = 3 * F[t], stake = 0;
      if (bets.length > 1) { stake = betTotal(bets.slice(0, -1), R.falta); pts += stake + (contraPrev ? 3 * F[1 - t] : 0); }
      R.florEnv.result = { winner: last.by, pts, stake };
      R.wonEnvite[t] = true;
      fromMano(G).filter(q => team(q) === t && R.flor.sung[q]).forEach(q => R.mustShow[q] = true);
      addPoints(G, t, pts, 'flor, envite no querido', 'flor');
      afterPoints(G);
      return;
    }
    startCanto(G, 'flor', { type: 'fenv', bets }, betTotal(bets, R.falta));
  }
  function settleFlores(G) {
    const R = G.round, F = florCount(G);
    if (!F[0] && !F[1]) return;
    if (F[0] && F[1]) {
      const first = fromMano(G).find(q => R.flor.sung[q] && R.flor.has[q]);
      R.florEnv = { curTeam: team(first), done: false, passed: [false, false] };
    } else {
      const t = F[0] ? 0 : 1;
      R.flor.sung.forEach((s, q) => { if (s) R.mustShow[q] = true; });
      addPoints(G, t, 3 * F[t], F[t] > 1 ? 'flores' : 'flor', 'flor');
      afterPoints(G);
    }
  }

  // ---- A ley de juego (Cap. VII), versión simplificada ----
  function leyTruco(G, accepted) {
    const R = G.round, L = R.ley;
    if (!L || !L.truco) return;
    if (accepted) {
      R.trucoLevel = 2; R.saidTruco[L.team] = true; R.saidQuiero[1 - L.team] = true; R.trucoOwner = 1 - L.team;
      info(G, 'Se juega el truco de la ley: vale 2.');
    } else winTruco(G, L.team, 1, 'truco no querido (a ley de juego)');
  }
  function applyLeyResp(G, p, a) {
    const R = G.round, L = R.ley, t = L.team, ct = 1 - t;
    L.pendingResp = false;
    R.envido.done = true;
    say(G, p, label(G, a));
    const chal = fromMano(G).filter(q => team(q) === t && R.flor.has[q]);
    const chd = fromMano(G).filter(q => team(q) === ct && R.flor.has[q]);
    const markSung = list => list.forEach(q => { R.flor.sung[q] = true; });
    if (L.envPart) {
      if (a.env) {
        say(G, preferHuman(G, fromMano(G).filter(q => team(q) === t)), chal.length ? 'Con ley' : 'A punto'); // Art. 80
        if (L.envPart === 'resto') {
          markSung(chd);
          if (chal.length) {
            markSung(chal);
            R.florEnv = { done: true };
            L.afterCanto = { truco: a.truco };
            startCanto(G, 'flor', { type: 'fenv', bets: [{ by: L.decider, amt: 'resto', contra: true }] }, R.falta);
            return;
          }
          settleFlores(G);
        } else {
          if (chal.length) { markSung(chal); settleFlores(G); }
          else {
            L.afterCanto = { truco: a.truco };
            startCanto(G, 'env', { type: 'env' }, R.falta);
            return;
          }
        }
      } else {
        R.wonEnvite[t] = true;
        addPoints(G, t, 1, 'envite no querido (a ley de juego)', 'envido');
        if (afterPoints(G)) return;
        if (chd.length || chal.length) {
          markSung(chd); markSung(chal);
          const F = florCount(G);
          if (F[0] && F[1]) { R.florEnv = { done: true }; L.afterCanto = { truco: a.truco }; startCanto(G, 'flor', { type: 'cmp' }, 0); return; }
          settleFlores(G);
        }
      }
      if (G.phase !== 'play') return;
    }
    leyTruco(G, a.truco);
  }

  function resolveTrick(G) {
    const R = G.round, m = R.muestra;
    let best = -1, holders = [];
    R.cur.forEach((c, q) => {
      if (!c) return;
      const r = rank(c, m);
      if (r > best) { best = r; holders = [q]; } else if (r === best) holders.push(q);
    });
    holders.sort((a, b) => pos(G, a) - pos(G, b));
    const teams = new Set(holders.map(team));
    let wt, wp;
    if (teams.size === 1 || G.rules.iguales === 'mano') { wp = holders[0]; wt = team(wp); } // Art. 12: entre iguales, el más mano
    else { wt = -1; wp = null; }
    R.tricks.push({ cards: R.cur.slice(), winnerTeam: wt, winnerPlayer: wp, leader: R.trickLeader });
    R.cur = Array(G.n).fill(null);
    const quien = G.names[wp] === 'Vos' ? 'vos' : G.names[wp];
    info(G, wt === -1 ? 'Baza parda.' : `Baza para ${G.n === 2 ? quien : quien + ' (' + G.teamNames[wt] + ')'}.`);
    const rw = roundWinner(R.tricks.map(t => t.winnerTeam), team(R.mano));
    if (rw !== null) {
      winTruco(G, rw, R.trucoLevel, R.trucoLevel === 1 ? 'mano ganada' : TRUCO_NAMES[R.trucoLevel].toLowerCase());
      return;
    }
    R.turn = firstInGameFrom(G, wt === -1 ? R.mano : wp); // Arts. 55 y 57
    R.trickLeader = R.turn;
  }

  function apply(G, p, a) {
    const R = G.round;
    if (actor(G) !== p) throw new Error('No es el turno de ' + p);
    const t = team(p);

    if (a.type === 'noley') {
      R.leyPhase = null;
      info(G, `Muestra: ${cardName(R.muestra)}.`);
      return;
    }
    if (a.type === 'ley') {
      // Art. 72: se impone antes de que se ponga la muestra
      R.leyPhase = null;
      say(G, p, 'A ley de juego: ' + LEY_FORMS[a.form].toLowerCase());
      info(G, `Muestra: ${cardName(R.muestra)}.`);
      const f = a.form;
      const parts = { falta: f === 'todo' || f.includes('falta'), resto: f === 'todo' || f.includes('resto'), truco: f === 'todo' || f.includes('truco') };
      const ct = 1 - t;
      const conLey = fromMano(G).some(q => team(q) === ct && R.flor.has[q]);
      const responder = preferHuman(G, fromMano(G).filter(q => team(q) === ct));
      say(G, responder, conLey ? 'Con ley' : 'A punto'); // Art. 74
      const envPart = conLey ? (parts.resto ? 'resto' : null) : (parts.falta ? 'falta' : null);
      R.ley = { team: t, decider: p, form: f, parts, conLey, envPart, truco: parts.truco, responder, pendingResp: !!(envPart || parts.truco), afterCanto: null };
      if (!R.ley.pendingResp) info(G, 'La ley no tiene nada que disputar con esa respuesta: se juega normal (Art. 78).');
      return;
    }
    if (a.type === 'leyresp') { applyLeyResp(G, p, a); return; }

    if (R.canto) { applyCanto(G, p, a); runAutoCanto(G); return; }

    if (a.type !== 'flor' && R.flor.has[p] && !R.flor.sung[p] && !R.flor.negada[p] && !R.flor.lost[p]) {

      R.faults[p].push('negada');

    const top = R.pending[R.pending.length - 1];

    switch (a.type) {
      case 'flor': {
        R.flor.sung[p] = true;
        say(G, p, '¡Flor!');
        if (!R.flor.has[p]) { penalize(G, p, 'flor cantada sin tenerla'); return; }
        const envTop = R.pending.findIndex(x => x.kind === 'env');

        return;
      }
      case 'noflor': {
        R.florQueue = R.florQueue.filter(x => x !== p);
        if (!R.florQueue.length) settleFlores(G);
        return;
      }
      case 'chica': {
        R.flor.achico[t] = true;
        R.florEnv.passed[t] = true;
        say(G, p, 'Con flor me achico');
        if (R.florEnv.passed[1 - t]) {
          R.florEnv.done = true;
          startCanto(G, 'flor', { type: 'cmp' }, 0);
        } else R.florEnv.curTeam = 1 - t;
        return;
      }
      case 'fenv': {
        const bet = { by: p, amt: a.amt, contra: a.contra };
        say(G, p, label(G, a).replace(/ \(\+\d+\)$/, ''));
        const to = florDecider(G, 1 - t);
        if (top && top.kind === 'fenv') { top.bets.push(bet); top.by = p; top.to = to; }
        else R.pending.push({ kind: 'fenv', by: p, to, bets: [bet] });
        return;
      }
      case 'envido': {
        const bet = { by: p, amt: a.amt, kind: a.kind };
        say(G, p, label(G, a).replace(/ \(\+\d+\)$/, ''));
        const to = rivalResponder(G, p, false);
        const raise = top && top.kind === 'env';
        if (raise) { top.bets.push(bet); top.by = p; top.to = to; }
        else R.pending.push({ kind: 'env', by: p, to, bets: [bet] });
        if (!raise) {
          // Al tocar: la flor del compañero queda negada o se dice "tengo flor" (según la mesa),
          // y los rivales que tengan flor la cantan antes de contestar (la flor anula el envido).
          if (G.rules.florCompanero === 'niega')
            fromMano(G).forEach(q => { if (q !== p && team(q) === t && florCandidate(G, q)) R.flor.lost[q] = true; });
          R.florQueue = fromMano(G).filter(q => q !== p && florCandidate(G, q) && (team(q) !== t || G.rules.florCompanero === 'tengo'));
        }
        return;
      }
      case 'truco': {
        say(G, p, TRUCO_NAMES[a.level]);
        if (top && top.kind === 'truco') {
          R.pending.pop();
          R.trucoLevel = top.level;
          R.saidQuiero[t] = true;
        }
        R.saidTruco[t] = true;
        R.trucoCalls[p]++;
        R.pending.push({ kind: 'truco', by: p, to: rivalResponder(G, p, true), level: a.level });
        return;
      }
      case 'quiero': {
        say(G, p, 'Quiero');
        R.pending.pop();
        if (top.kind === 'truco') { R.trucoLevel = top.level; R.trucoOwner = t; R.saidQuiero[t] = true; }
        else if (top.kind === 'env') resolveEnvido(G, top.bets, true);
        else if (top.kind === 'fenv') resolveFlorEnv(G, top.bets, true);
        return;
      }
      case 'noquiero': {
        say(G, p, 'No quiero');
        R.pending.pop();
        if (top.kind === 'truco') winTruco(G, 1 - t, R.trucoLevel, TRUCO_NAMES[top.level].toLowerCase() + ' no querido');
        else if (top.kind === 'env') resolveEnvido(G, top.bets, false);
        else if (top.kind === 'fenv') resolveFlorEnv(G, top.bets, false);
        return;
      }
      case 'mazo': {
        say(G, p, 'Me voy al mazo');
        if (R.mustShow[p]) info(G, G.names[p] === 'Vos' ? 'Mostrás tus cartas del envite antes de irte (Art. 45).' : `${G.names[p]} muestra sus cartas del envite antes de irse (Art. 45).`);
        if (!esPie(G, p) && G.rules.mazo === 'solo') {
          // Sin ser el pie: se va solo él y su equipo sigue jugando

          if (R.cur.some(x => x) && trickComplete(G)) resolveTrick(G);
          else R.turn = nextIn(G, p);
          return;
        }
        R.pending = [];
        winTruco(G, 1 - t, R.trucoLevel, G.n === 2 ? 'el rival se fue al mazo' : 'el otro equipo se fue al mazo');
        return;
      }
      case 'paso': {
        say(G, p, 'Paso');
        R.out[p] = true;
        if (!fromMano(G).some(q => team(q) === t)) { winTruco(G, 1 - t, R.trucoLevel, 'el otro equipo pasó'); return; }
        if (R.cur.some(x => x) && trickComplete(G)) resolveTrick(G);
        else R.turn = nextIn(G, p);
        return;
      }
      case 'play': {
        const i = R.hands[p].findIndex(c => c.id === a.card.id);
        if (i < 0) throw new Error('Carta inválida');
        const c = R.hands[p].splice(i, 1)[0];
        if (R.cur.every(x => x === null)) R.trickLeader = p;
        R.cur[p] = c;
        R.played[p]++;
        if (trickComplete(G)) resolveTrick(G);
        else R.turn = nextIn(G, p);
        return;
      }
    }
    throw new Error('Acción desconocida ' + a.type);
  }

  function nextRound(G) {
    if (G.phase === 'matchEnd') return G;
    if (G.phase === 'duelEnd') {
      const R = G.round;
      R.duel.idx++;
      const pair = R.duel.pairs[R.duel.idx];
      initPlay(G, pair, pair[0]);
      G.phase = 'play';
      info(G, `Duelo ${R.duel.idx + 1} de 3: ${duelLabel(G)}.`);
      return G;
    }
    if (G.phase === 'chicoEnd') { G.scores = [0, 0]; G.roundInChico = 0; }

  }

  const Truco = {
    setRng, makeDeck, shuffle, piezaRole, isPieza, rank, category, envVal, hasFlor,

// Truco Uruguayo — lo que ve cada jugador.
// viewFor(G, s) devuelve una copia del partido con solo lo que el jugador del lugar s puede saber:
// sus cartas, las cartas jugadas, la muestra (salvo mientras se decide a ley de juego), las señas

// ({ id: 'x<lugar>-<n>', hidden: true }). El anfitrión le manda a cada invitado su vista, y cada
// pantalla dibuja la suya, así que nadie tiene en sus datos lo que no le corresponde ver.

  function viewFor(G, s, opts) {
    opts = opts || {};

        R.initial[q] = R.initial[q].map((c, i) => inHand.has(c.id) ? tapada('y', q, i) : c);

<script>

if (savedPlayers) players = ['4','6'].includes(savedPlayers) ? +savedPlayers : 2;
if (['facil','normal','dificil'].includes(store.get('truco.level'))) level = store.get('truco.level');
if (SPEEDS[store.get('truco.speed')]) speed = store.get('truco.speed');

// ---------- Cartas: baraja española, diseño propio ----------
// Colores clásicos (rojo, amarillo, azul, verde), pintas en el marco
// (oros 1 corte, copas 2, espadas 3, bastos 4) y cada número con sus palos.
const COL = { red:'#c8312b', yellow:'#f2c230', blue:'#5b9bd8', green:'#3c8c3a', skin:'#f3cfa8', ink:'#3a2a1a', horse:'#dfe9f5', brown:'#7a5a3a' };
const SUIT_COLOR = { oro:'#a8740a', copa:'#c8312b', espada:'#2d5aa0', basto:'#3c7a32' };
const GAPS = { oro:1, copa:2, espada:3, basto:4 };
const PAL = { oro:[COL.red, COL.green], copa:[COL.green, COL.red], espada:[COL.blue, COL.red], basto:[COL.red, COL.blue] };
const f1 = v => (Math.round(v*10)/10);

function coin(x, y, r){
  let t = '';
  for (let i=0;i<16;i++){
    const a = i*Math.PI/8, c = Math.cos(a), s = Math.sin(a);
    t += `<line x1="${f1(x+c*r*.6)}" y1="${f1(y+s*r*.6)}" x2="${f1(x+c*r*.86)}" y2="${f1(y+s*r*.86)}" stroke="#c0661a" stroke-width="${f1(r*.1)}" stroke-linecap="round"/>`;
  }
  return `<circle cx="${x}" cy="${y}" r="${r}" fill="${COL.yellow}" stroke="${COL.ink}" stroke-width="${f1(Math.max(.8,r*.07))}"/>${t}
    <circle cx="${x}" cy="${y}" r="${f1(r*.48)}" fill="#f8d968" stroke="#c0661a" stroke-width="${f1(r*.07)}"/>

function cup(x, y, s){
  const k = s/40;
  return `<g transform="translate(${f1(x-20*k)},${f1(y-20*k)}) scale(${f1(k*100)/100})" stroke="${COL.ink}" stroke-width="1.1" stroke-linejoin="round">
    <path d="M6 6 H34 C34 16 28 21 20 21 C12 21 6 16 6 6 Z" fill="${COL.red}"/>
    <path d="M8 11 Q20 16 32 11" fill="none" stroke="${COL.yellow}" stroke-width="2.2"/>
    <rect x="4.5" y="3.5" width="31" height="4" rx="1.5" fill="${COL.yellow}"/>
    <rect x="17.5" y="21" width="5" height="9" fill="${COL.yellow}"/>
    <ellipse cx="20" cy="26" rx="5" ry="2.2" fill="${COL.blue}"/>
    <path d="M9 37 Q20 28 31 37 Z" fill="${COL.red}"/>
    <rect x="8" y="36" width="24" height="2.4" rx="1" fill="${COL.yellow}"/>
  </g>`;
}
function sword(x, y, L, ang){
  const h = L/2, w = Math.min(L*.06, 3.2), g = h*.5, lw = f1(Math.max(.6, w*.32));
  return `<g transform="translate(${f1(x)},${f1(y)}) rotate(${ang||0})" stroke="${COL.ink}" stroke-width="${lw}" stroke-linejoin="round">
    <path d="M0 ${f1(-h)} L${f1(w)} ${f1(-h+w*2.4)} L${f1(w)} ${f1(g)} L${f1(-w)} ${f1(g)} L${f1(-w)} ${f1(-h+w*2.4)} Z" fill="#b8d6f2"/>
    <line x1="0" y1="${f1(-h+w*2.6)}" x2="0" y2="${f1(g-1)}" stroke="#4f7fb3" stroke-width="${lw}"/>
    <rect x="${f1(-w*2.6)}" y="${f1(g)}" width="${f1(w*5.2)}" height="${f1(w*1.4)}" rx="${f1(w*.6)}" fill="${COL.yellow}"/>
    <rect x="${f1(-w*.85)}" y="${f1(g+w*1.4)}" width="${f1(w*1.7)}" height="${f1(h*.28)}" fill="${COL.red}"/>
    <circle cx="0" cy="${f1(g+w*1.4+h*.28+w*.9)}" r="${f1(w*1.1)}" fill="${COL.yellow}"/>
  </g>`;
}
function club(x, y, L, ang, color){
  const h = L/2, wt = Math.min(L*.12, 7.5), wb = wt*.45, lw = f1(Math.max(.6, wt*.14));
  let knots = '';
  [-.45, -.05, .35].forEach((t, i) => {
    const side = i%2 ? 1 : -1, ww = wt + (wb-wt)*((t+1)/2);
    knots += `<ellipse cx="${f1(-side*ww*.25)}" cy="${f1(h*t+wt*.4)}" rx="${f1(wt*.18)}" ry="${f1(wt*.28)}" fill="${COL.ink}" stroke="none"/>`;
  });
  return `<g transform="translate(${f1(x)},${f1(y)}) rotate(${ang||0})" stroke="${COL.ink}" stroke-width="${lw}" stroke-linejoin="round">
    <path d="M${f1(-wb)} ${f1(h)} L${f1(-wt)} ${f1(-h*.6)} Q${f1(-wt)} ${f1(-h)} 0 ${f1(-h)} Q${f1(wt)} ${f1(-h)} ${f1(wt)} ${f1(-h*.6)} L${f1(wb)} ${f1(h)} Z" fill="${color}"/>
    <path d="M${f1(-wt*.35)} ${f1(-h*.8)} L${f1(-wb*.4)} ${f1(h*.8)}" stroke="rgba(255,255,255,.55)" stroke-width="${f1(wt*.22)}" fill="none"/>
    ${knots}
    <ellipse cx="0" cy="${f1(h)}" rx="${f1(wb)}" ry="${f1(wb*.5)}" fill="#e9d3a8"/>
  </g>`;
}
const CLUB_COLORS = [COL.red, COL.green, COL.blue, COL.yellow];

function pipAt(s, x, y, size, i){
  if (s==='oro') return coin(x, y, size/2);
  if (s==='copa') return cup(x, y, size);
  if (s==='espada') return sword(x, y, size*2, 0);
  return club(x, y, size*1.9, -18, CLUB_COLORS[(i||0)%4]);
}

const ROUND_POS = {
  2:[[50,46],[50,106]], 3:{oro:[[34,42],[50,76],[66,110]], copa:[[50,40],[50,76],[50,112]]},
  4:[[33,44],[67,44],[33,108],[67,108]], 5:[[33,42],[67,42],[50,76],[33,110],[67,110]],
  6:[[33,40],[67,40],[33,76],[67,76],[33,112],[67,112]], 7:[[33,34],[67,34],[50,56],[33,80],[67,80],[33,114],[67,114]],
};
function longPos(n){
  if (n===2) return [[40,76,98,0],[60,76,98,0]];
  if (n===3) return [[30,76,98,0],[50,76,98,0],[70,76,98,0]];
  const xs = n<=5 ? [38,62] : [30,50,70], out = [];
  for (const x of xs){ out.push([x,49,46,0]); out.push([x,103,46,0]); }
  if (n===5 || n===7) out.push([50,76,60,90]);
  return out;
}
function pipsBody(c){
  const s = c.s, n = c.n;
  if (s==='oro' || s==='copa'){
    const P = n===3 ? ROUND_POS[3][s] : ROUND_POS[n];
    const size = s==='oro' ? (n<=3?30:n<=5?26:20) : (n<=3?34:n<=5?30:26);
    return P.map(([x,y],i) => pipAt(s, x, y, size, i)).join('');
  }
  return longPos(n).map(([x,y,L,a],i) => s==='espada' ? sword(x,y,L,a) : club(x,y,L*0.98,a,CLUB_COLORS[i%4])).join('');
}
function leaf(x, y, ang, k){
  k = k||1;
  return `<path transform="translate(${x},${y}) rotate(${ang}) scale(${k})" d="M0 0 Q6 -5 13 0 Q6 5 0 0 Z" fill="${COL.green}" stroke="${COL.ink}" stroke-width=".8"/>`;
}
function aceBody(s){
  if (s==='oro') return `${leaf(30,106,150,1.3)}${leaf(70,106,30,1.3)}${leaf(26,96,190,1.1)}${leaf(74,96,-10,1.1)}${coin(50,74,25)}`;
  if (s==='copa') return `${leaf(22,70,200)}${leaf(78,70,-20)}${cup(50,78,70)}`;
  if (s==='espada') return `<path d="M30 96 Q40 92 50 98 Q60 92 70 96" fill="none" stroke="${COL.green}" stroke-width="3"/>${leaf(30,96,200)}${leaf(70,96,-20)}${leaf(36,90,230,.9)}${leaf(64,90,-50,.9)}${sword(50,76,118,0)}`;
  return `${club(50,80,104,0,COL.red)}${leaf(58,34,-40,1.1)}${leaf(40,40,210,1)}${leaf(60,52,-10,.9)}`;
}
function head(x, y){
  return `<circle cx="${x}" cy="${y}" r="7" fill="${COL.skin}" stroke="${COL.ink}" stroke-width="1"/>
    <circle cx="${x-2.4}" cy="${y-.8}" r=".85" fill="${COL.ink}"/><circle cx="${x+2.4}" cy="${y-.8}" r=".85" fill="${COL.ink}"/>
    <path d="M${x-2} ${y+3} q2 1.4 4 0" stroke="${COL.ink}" stroke-width=".8" fill="none"/>`;
}
function figureBody(c){
  const s = c.s, col = SUIT_COLOR[c.s], I = COL.ink;
  const name = {10:'SOTA', 11:'CABALLO', 12:'REY'}[c.n];
  let emblem;
  if (c.n === 12) emblem = `<path d="M36 44 L38 28 L44 37 L50 24 L56 37 L62 28 L64 44 Z" fill="${COL.yellow}" stroke="${I}" stroke-width="1.2" stroke-linejoin="round"/>
      <rect x="35" y="43" width="30" height="5" rx="1.5" fill="${COL.yellow}" stroke="${I}" stroke-width="1.2"/>
      <circle cx="50" cy="33" r="1.8" fill="${COL.red}"/><circle cx="41" cy="39" r="1.3" fill="${COL.blue}"/><circle cx="59" cy="39" r="1.3" fill="${COL.blue}"/>`;
  else if (c.n === 11) emblem = `<g transform="translate(31,22) scale(.95)"><path d="M28 3 L25 0 L23 6 C17 7 11 12 7 19 L3 25 C2 28 5 30 8 29 L13 26 C15 29 17 33 17 38 L33 38 C33 30 32 22 33 14 C34 9 32 6 28 3 Z" fill="${COL.horse}" stroke="${I}" stroke-width="1.3" stroke-linejoin="round"/>
      <path d="M25 6 C29 14 30 26 31 37" stroke="${COL.brown}" stroke-width="2.6" fill="none"/><circle cx="17" cy="14" r="1.3" fill="${I}"/><circle cx="7" cy="25" r=".9" fill="${I}"/></g>`;
  else emblem = `<path d="M34 42 Q50 22 66 42 Z" fill="${col}" stroke="${I}" stroke-width="1.2"/><ellipse cx="50" cy="42" rx="19" ry="4" fill="${col}" stroke="${I}" stroke-width="1.2"/>
      <path d="M60 33 Q70 20 78 26" stroke="${COL.red}" stroke-width="2.6" fill="none" stroke-linecap="round"/>`;
  const pip = c.s==='espada' ? sword(50, 84, 44, 0) : c.s==='basto' ? club(50, 84, 42, 0, COL.red) : pipAt(c.s, 50, 84, c.s==='oro' ? 30 : 32, 0);
  return `<rect x="16" y="27" width="68" height="99" rx="10" fill="${col}" fill-opacity=".08" stroke="${col}" stroke-width="1.2"/>
    <rect x="20" y="31" width="60" height="91" rx="8" fill="none" stroke="${col}" stroke-opacity=".45" stroke-width=".8"/>
    <g transform="translate(0,9) scale(1 .92)">${emblem}</g>${pip}
    <text x="50" y="117" text-anchor="middle" font-family="Alegreya, Georgia, serif" font-weight="800" font-size="10.5" letter-spacing="1.5" fill="${col}">${name}</text>`;
}
function frameLine(x1, x2, y, gaps, color){
  const segs = gaps + 1, gap = 6, len = (x2 - x1 - gaps*gap)/segs;
  let out = '';
  for (let i=0;i<segs;i++){ const a = x1 + i*(len+gap); out += `<line x1="${f1(a)}" y1="${y}" x2="${f1(a+len)}" y2="${y}" stroke="${color}" stroke-width="1.6"/>`; }
